server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression — same defaults as the main site
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_vary on;
  gzip_min_length 1000;

  # Storybook is a SPA — every unknown route falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets — long cache
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|avif|ico|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # HTML — short cache, must revalidate (Storybook iframe + index)
  location ~* \.html$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
  }

  # Security headers — slightly relaxed: Storybook needs same-origin iframes
  # for its preview pane, so X-Frame-Options stays SAMEORIGIN here.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
